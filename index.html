<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>은평관 FIRE FINAL MISSION</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0b0f17;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
body{min-height:100vh}
button{appearance:none;-webkit-appearance:none;touch-action:manipulation}
.app{max-width:520px;min-height:100vh;margin:auto;background:#151b26}
.top{display:flex;justify-content:space-between;align-items:center;padding:17px 16px 12px;background:#0f141e;font-weight:900}
.title{font-size:15px}.hearts{font-size:21px;letter-spacing:2px}
.progress{height:5px;background:#303746}.bar{height:100%;background:#ef3340;width:0}
.screen{padding:18px 16px 45px}.badge{display:inline-block;background:#e51d2a;padding:5px 9px;border-radius:7px;font-size:11px;font-weight:900}
h1{font-size:26px;line-height:1.25;margin:12px 0 9px}p{color:#c8d0dc;line-height:1.55}
.scene{position:relative;overflow:hidden;border:1px solid #3b4556;border-radius:14px;margin:14px 0;background:#080b11}
.scene img.bg{display:block;width:100%;height:225px;object-fit:cover}.scene img.dreami{position:absolute;right:4px;bottom:2px;width:125px;height:125px;object-fit:contain}
.card,.notice{background:#202836;border:1px solid #3b4657;border-radius:13px;padding:14px;margin:12px 0}
.q{font-size:17px;font-weight:900;line-height:1.5}.opts{display:grid;gap:10px;margin-top:12px}
button{width:100%;border:1px solid #485467;background:#283241;color:#fff;border-radius:11px;padding:14px;font:inherit;font-weight:750;text-align:left;line-height:1.45;min-height:52px}
button:active{transform:scale(.99)}.primary{background:#e51d2a;border-color:#e51d2a;text-align:center;margin-top:12px}
.feedback{padding:11px;border-radius:10px;margin-top:10px;line-height:1.5;font-size:14px}.bad{background:#48202a;color:#ffc0c7}.good{background:#163d2b;color:#a7ffca}
.radio{background:#111722;border:1px dashed #5a6678;border-radius:10px;padding:12px;line-height:1.65;color:#e0e7f0}
.locgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.loc{text-align:center;min-height:76px}.selected{border-color:#ffd34f;background:#443b20}
.center{text-align:center}.big{font-size:36px;font-weight:1000}.small{font-size:12px;color:#aeb8c7}
.hidden{display:none}

.locgrid.photoGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.locCard{padding:0!important;overflow:hidden;border:2px solid #4c5868!important;background:#202733!important;border-radius:14px!important;min-height:0!important;display:flex;flex-direction:column;text-align:left!important;box-shadow:0 3px 0 rgba(0,0,0,.25)}.locCard:active{transform:translateY(1px)}.locCard .locPhoto{display:block;width:100%;aspect-ratio:4/3;background:#111;overflow:hidden}.locCard .locPhoto img{width:100%;height:100%;display:block;object-fit:cover}.locCard .locName{display:block;padding:10px 8px;color:#fff;font-size:15px;font-weight:900;text-align:center;line-height:1.25;background:#252d39}.locCard.selected{border-color:#ffd34f!important;box-shadow:0 0 0 2px rgba(255,211,79,.2),0 3px 0 rgba(0,0,0,.25)}.missionText{line-height:1.55}.feedback{position:relative;z-index:5}.locCard img{pointer-events:none}@media(max-width:520px){.locgrid.photoGrid{grid-template-columns:1fr;gap:10px}.locCard .locPhoto{aspect-ratio:16/10}.locCard .locName{font-size:16px;padding:11px 8px}}
</style>
</head>

const LOC = {"홀":"HALL","2관 퇴출로":"EXIT2","사무실 비상계단 앞":"OFFICE","게임파크 앞":"GAME","8관 베이비시트 앞":"BABY"};
const state = {step:0, hearts:3, assigned:"홀", selected:"홀", stair:true, mobility:true, remaining:new Set()};

function el(id){ return document.getElementById(id); }
function updateTop(){
  el("hearts").textContent = "❤️".repeat(Math.max(0,state.hearts)) + "🖤".repeat(Math.max(0,3-state.hearts));
  el("bar").style.width = Math.min(100, Math.round(state.step/12*100)) + "%";
}
function setScreen(html){
  el("screen").innerHTML = html;
  updateTop();
  window.scrollTo(0,0);
}
function scene(bg, dreami=true){
  return '<div class="scene"><img class="bg" src="'+IMG[bg]+'" alt=""><'+(dreami?'img':'div')+' class="dreami" '+(dreami?'src="'+IMG.DREAMI+'" alt="드리미"':'')+'></'+(dreami?'img':'div')+'></div>';
}
function wrong(msg){
  state.hearts--;
  updateTop();
  if(state.hearts<=0){ fail(); return true; }
  el("fb").innerHTML='<div class="feedback bad">'+msg+'<br>❤️ 1개가 차감되었습니다. 같은 단계에서 다시 선택하세요.</div>';
  return false;
}
function fail(){
  setScreen('<div class="center"><span class="badge">MISSION FAILED</span><h1>목숨을 모두 잃었습니다</h1><div class="big">0 POINT</div><p>오답 3회로 미션이 종료되었습니다.</p><button class="primary" id="restart">다시 테스트</button></div>');
  el("restart").onclick=start;
}
function question(title,text,opts,correct,next){
  state.step++;
  let buttons=opts.map((x,i)=>'<button class="answer" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+x+'</button>').join("");
  setScreen('<span class="badge">STEP '+state.step+'</span><h1>'+title+'</h1><div class="card"><div class="q">'+text+'</div><div class="opts">'+buttons+'</div><div id="fb"></div></div>');
  document.querySelectorAll(".answer").forEach(b=>b.onclick=function(){
    const i=Number(this.dataset.i);
    if(i===correct){ this.classList.add("good"); setTimeout(next,160); }
    else { wrong("오답입니다."); }
  });
}
function start(){
  state.step=0; state.hearts=3; state.assigned="홀"; state.selected="홀"; state.stair=true; state.mobility=true; state.remaining.clear();
  setScreen('<span class="badge">STANDALONE TEST</span><h1>하부층 화재<br>FINAL MISSION</h1><p>기존 소방퀴즈와 연결하지 않은 독립 테스트입니다.</p>'+scene("SMOKE")+
  '<div class="notice">테스트 배정 위치: <b>홀</b><br>비상계단: <b>사용 가능</b><br>거동 불편 고객: <b>발견</b></div>'+
  '<button class="primary" id="begin">미션 시작</button>');
  el("begin").onclick=step1;
}
function step1(){ question("최초 보고","하부층에서 연기 유입을 발견했다면 사무실에 어떻게 보고해야 할까요?",[
"하부층에서 연기 발생, 즉시 확인 부탁드립니다","하부층에서 빨간모자 발생, 빨간모자 발생, 빨간모자 발생","하부층 상황 확인 후 필요하면 다시 보고하겠습니다","화재 여부를 확인한 뒤 고객 대피부터 진행하겠습니다"],1,step2); }
function step2(){ question("화재 주변 고객 대피","관리자가 “지금 즉시 화재 주변 고객 대피 부탁드립니다.”라고 지시했습니다. 가장 먼저 할 행동은?",[
"사무실로 돌아가 추가 지시를 기다린다","경광봉을 들고 “고객님 대피 부탁드립니다”라고 안내하며 화재 주변 고객을 대피시킨다","확성기를 먼저 챙긴 뒤 지정위치로 바로 이동한다","잔여인원 확인을 먼저 완료한 후 고객을 대피시킨다"],1,step3); }
function step3(){
  state.step++;
  const names=Object.keys(LOC);
  const cards=names.map(x=>
    '<button type="button" class="locCard" data-loc="'+x+'">'+
      '<span class="locPhoto"><img src="'+IMG[LOC[x]]+'" alt="'+x+' 지정위치 사진"></span>'+
      '<span class="locName">'+x+'</span>'+
    '</button>'
  ).join("");
  setScreen(
    '<span class="badge">STEP '+state.step+'</span>'+
    '<h1>지정위치 어디로 이동할까요?</h1>'+
    '<p class="missionText">화재 주변 고객 대피 후, 배정받은 지정위치로 이동합니다.<br><b>사진을 확인하고 이동할 위치를 선택하세요.</b></p>'+
    '<div class="locgrid photoGrid">'+cards+'</div>'+
    '<div id="fb"></div>'
  );
  document.querySelectorAll("[data-loc]").forEach(b=>b.onclick=function(){
    if(this.dataset.loc===state.assigned){
      state.selected=this.dataset.loc;
      this.classList.add("selected");
      setTimeout(step4,180);
    }else{
      wrong("배정된 지정위치가 아닙니다. 사진과 위치를 다시 확인해 주세요.");
    }
  });
}
function step4(){
  state.step++;
  setScreen('<span class="badge">STEP '+state.step+'</span><h1>비상계단 문 손잡이 확인</h1><p>지정위치에서 대피하기 전, 문 손잡이의 온도를 확인합니다.</p>'+scene(LOC[state.selected])+
  '<div class="card"><div class="q">문 손잡이의 온도를 어떻게 확인할까요?</div><div class="opts">'+
  ["비상계단 난간을 손으로 확인한다","비상계단 문 손잡이를 손등으로 확인한다","문을 바로 열고 계단으로 내려간다","계단의 조명을 먼저 확인한다"].map((x,i)=>'<button class="door" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+x+'</button>').join("")+
  '</div><div id="fb"></div></div>');
  document.querySelectorAll(".door").forEach(b=>b.onclick=function(){if(Number(this.dataset.i)===1)step5();else wrong("문 손잡이는 손등으로 확인해야 합니다.");});
}
function step5(){question("아래 상황 확인","문 손잡이가 뜨겁지 않았다면 다음 행동은 무엇일까요?",[
"문을 열고 아래쪽 계단의 상황을 확인한다","바로 옥외 피난계단으로 이동한다","문 손잡이를 다시 잡고 기다린다","잔여인원 확인부터 시작한다"],0,step6);}
function step6(){
  const opts=state.stair?["비상계단을 이용해 대피한다","문을 다시 닫고 홀에 대기한다","잔여인원 확인 후 계단 이용 여부를 결정한다","매점 방향으로 이동한다"]:
  ["옥외 피난계단을 이용해 대피한다","비상계단을 그대로 이용한다","문을 다시 열고 내려간다","홀에 남아 대기한다"];
  question("대피경로 판단","문을 열어 아래 상황을 확인했습니다. 현재 비상계단은 <b>"+(state.stair?"사용 가능":"사용 불가")+"</b> 상태입니다. 어떤 경로로 대피할까요?",opts,0,step7);
}
function step7(){
  state.step++;
  setScreen('<span class="badge">STEP '+state.step+'</span><h1>지정위치에서 대피 안내</h1>'+scene(LOC[state.selected])+
  '<div class="card"><div class="q">경광봉을 머리 위로 들고 다음 순서대로 안내합니다.</div><div class="radio">“고객님 이쪽으로 대피 부탁드립니다” ×2<br>“어린이와 노약자 우선 대피 부탁드립니다”<br>“빨간 티셔츠 입은 고객님 거동이 불편한 고객님과 함께 대피 부탁드립니다”</div><button class="primary" id="next">안내 완료</button></div>');
  el("next").onclick=step8;
}
function step8(){
  state.step++;
  setScreen('<span class="badge">STEP '+state.step+'</span><h1>0구역 보고</h1><div class="card"><div class="radio">“대피 완료했습니다. 잔여인원 확인 하러 이동하겠습니다”</div><button class="primary" id="next">보고 완료</button></div>');
  el("next").onclick=step9;
}
function step9(){
  state.step++; state.remaining.clear();
  setScreen('<span class="badge">STEP '+state.step+'</span><h1>잔여인원 확인</h1><p><b>상영관·홀·화장실</b> 3곳을 모두 선택하세요. 순서는 자유입니다. 매점은 선택하지 않습니다.</p><div class="locgrid">'+["상영관","홀","화장실","매점"].map(x=>'<button class="loc remain" data-rem="'+x+'">'+x+'</button>').join("")+'</div><button class="primary" id="check">확인</button><div id="fb"></div>');
  document.querySelectorAll(".remain").forEach(b=>b.onclick=function(){const x=this.dataset.rem;if(state.remaining.has(x)){state.remaining.delete(x);this.classList.remove("selected")}else{state.remaining.add(x);this.classList.add("selected")}});
  el("check").onclick=function(){const ok=state.remaining.size===3&&["상영관","홀","화장실"].every(x=>state.remaining.has(x));if(ok)step10();else{state.remaining.clear();document.querySelectorAll(".remain").forEach(b=>b.classList.remove("selected"));wrong("상영관·홀·화장실 3곳을 정확히 선택해야 합니다.");}};
}
function step10(){
  if(!state.mobility){finish();return;}
  question("거동이 불편한 고객 발견","잔여인원을 확인하던 중 거동이 불편한 고객을 발견했습니다. 어떻게 조치할까요?",[
  "고객을 그 자리에 두고 다른 장소의 확인을 먼저 완료한다","고객을 안전한 장소로 이동시키고 관리자에게 보고한다","고객에게 혼자 이동할 수 있는지 물어본 뒤 그대로 이동시킨다","상영관 안에서 대피방송이 끝날 때까지 대기하도록 안내한다"],1,step11);
}
function step11(){question("안전한 장소 선택","거동이 불편한 고객을 이동시킬 안전한 장소는 어디일까요?",[
"홀 중앙","매점 앞","옥외 피난계단 (2관 퇴출로 왼쪽 계단)","상영관 내부"],2,finish);}
function finish(){
  state.step++;
  setScreen('<span class="badge">FINAL CLEAR</span><h1>MISSION CLEAR</h1>'+scene("HALL")+
  '<div class="card"><div class="radio">“00에서 거동이 불편한 고객 발견하여 안전한 장소로 이동하였습니다”</div></div>'+
  '<div class="card center"><p>모든 대응 절차를 완료했습니다.</p><div class="big">+1 POINT</div><p class="small">최종 집결지: <b>구파발역 3번 출구</b></p></div><button class="primary" id="restart">테스트 다시하기</button>');
  el("restart").onclick=start;
}
start();
</script>
</body>
</html>
