<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>은평관 FIRE FINAL MISSION</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#1b1511;color:#2b2018;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{overflow-x:hidden}
button{font:inherit}
#game{width:100%;max-width:980px;margin:0 auto;background:#201711;min-height:100vh}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(#4a311e,#2b1e16);color:#fff;border-bottom:2px solid #9c7040;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:16px;font-weight:950}.step{font-size:11px;color:#e5cfaa;margin-top:2px}.hearts{font-size:20px;white-space:nowrap}
.bar{height:5px;background:#33231a}.bar i{display:block;height:100%;background:#e4b35a;width:0;transition:width .2s}
.screen{position:relative;min-height:calc(100vh - 62px);overflow:visible}
.scene{position:relative;min-height:520px;overflow:hidden}
.scene-photo{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene-dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,8,.08) 20%,rgba(20,12,8,.15) 45%,rgba(20,12,8,.82) 82%,rgba(20,12,8,.96) 100%)}
.badge{position:absolute;z-index:4;top:13px;left:13px;padding:7px 10px;border-radius:9px;background:rgba(55,31,19,.9);border:1px solid #d8aa5e;color:#f9e4ba;font-weight:900;font-size:12px}
.smoke{position:absolute;z-index:3;left:8%;top:7%;width:55%;height:45%;pointer-events:none;opacity:.72}
.smoke b{position:absolute;border-radius:50%;background:rgba(65,64,63,.65);filter:blur(12px);animation:sm 4s ease-in-out infinite}
.smoke b:nth-child(1){width:90px;height:90px;left:15%;top:55%}.smoke b:nth-child(2){width:120px;height:120px;left:32%;top:30%;animation-delay:.7s}.smoke b:nth-child(3){width:80px;height:80px;left:52%;top:45%;animation-delay:1.4s}.smoke b:nth-child(4){width:150px;height:150px;left:5%;top:8%;animation-delay:2s}
@keyframes sm{50%{transform:translateY(-25px) scale(1.08);opacity:.48}}
.dialog{position:absolute;z-index:10;left:10px;right:10px;bottom:10px;background:#f8edcf;border:3px solid #68472b;border-radius:17px;padding:12px 14px 14px;box-shadow:0 6px 0 rgba(30,17,9,.5)}
.name{display:inline-block;background:#68472b;color:#fff;padding:5px 11px;border-radius:8px;font-weight:900;font-size:13px;margin-bottom:7px}
.dialog p{white-space:pre-line;margin:0 0 11px;line-height:1.5;font-size:15px;font-weight:780}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button,.restart{min-height:48px;border:2px solid #76502e;background:#fff8e8;color:#392719;border-radius:11px;padding:9px 10px;font-weight:900;cursor:pointer}
.actions button.primary,.restart{background:#ead19d}
.actions button:active,.restart:active{transform:translateY(1px)}
.note{font-size:11px;color:#73563b;line-height:1.4;margin-top:7px}
.full{position:relative;min-height:calc(100vh - 62px);padding:16px 12px 28px;background:linear-gradient(#3b2a1d,#211711)}
.full .character{display:block;margin:0 auto 4px;height:125px;width:auto;image-rendering:auto;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.3))}
.full .panel{background:#f8edcf;border:3px solid #68472b;border-radius:18px;padding:14px;box-shadow:0 6px 0 rgba(25,14,8,.45)}
.full .panel p{margin:0 0 13px;font-size:17px;font-weight:900;line-height:1.45}
.location-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.loc{display:block;width:100%;padding:0;background:#fff8e8;border:2px solid #7a5634;border-radius:12px;overflow:hidden;text-align:left;cursor:pointer}
.loc img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.loc span{display:block;padding:10px 10px 11px;font-weight:950;font-size:14px;line-height:1.3}
.loc:active{transform:translateY(1px)}
.loc.wrong{animation:shake .24s ease;border-color:#c54c3e}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.equipment-grid{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:9px;overflow-x:auto;padding-bottom:6px}
.eq{min-width:110px;border:3px solid #795533;border-radius:13px;background:#fff8e8;padding:6px;cursor:pointer}
.eq img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#f4e8cd;border-radius:8px}
.eq span{display:block;margin-top:6px;background:#4a301f;color:#fff;padding:7px 4px;border-radius:7px;text-align:center;font-weight:950;font-size:13px}
.eq.selected{border-color:#e2af4f;box-shadow:0 0 0 3px rgba(226,175,79,.35)}
.eq.wrong{border-color:#c54c3e;animation:shake .24s ease}
.count{margin-top:10px;text-align:center;font-weight:900;color:#5e4128}
.final{text-align:center;padding:24px 12px}
.final h2{font-size:26px;margin:8px 0}.final p{line-height:1.6}.final button{margin-top:8px}
@media(max-width:620px){
 .actions{grid-template-columns:1fr}
 .location-grid{grid-template-columns:1fr}
 .equipment-grid{grid-template-columns:repeat(5,130px);overflow-x:auto}
 .scene{min-height:610px}
 .dialog p{font-size:14px}
}
</style>
</head>

const LOCS=[["홀", "hall"], ["2관 퇴출로", "exit2"], ["사무실 비상계단 앞", "office"], ["게임파크 앞", "gamepark"], ["8관 베이비시트 앞", "baby"]];
const STORAGE_KEY="eunpyeong_fire_final_v7_state";
const ASSIGNED="홀"; // standalone test only
let state={scene:"start",hearts:3,location:null,equipment:[]};

const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(s&&s.hearts>0&&s.scene){state={...state,...s};return true}}catch(e){}return false}
function hud(){
 $("hearts").textContent="❤️".repeat(Math.max(0,state.hearts))+"🖤".repeat(Math.max(0,3-state.hearts));
 const order=["start","manager","evacuate","equipment","location","guide","door","down","remaining","mobility","safe","clear"];
 $("barfill").style.width=Math.min(100,Math.round(order.indexOf(state.scene)/(order.length-1)*100))+"%";
 const labels={start:"MISSION START",manager:"STEP 1 · 화재 인지",evacuate:"STEP 2 · 초기 대피",equipment:"STEP 3 · 장비 선택",location:"STEP 4 · 지정위치",guide:"STEP 5 · 대피 안내",door:"STEP 6 · 비상구 확인",down:"STEP 7 · 아래 상황 확인",remaining:"STEP 8 · 잔여인원 확인",mobility:"STEP 9 · 거동 불편 고객",safe:"STEP 10 · 안전 장소",clear:"MISSION CLEAR"};
 $("step").textContent=labels[state.scene]||"FINAL MISSION";
}
function spend(){
 state.hearts--;save();hud();
 if(state.hearts<=0){state.scene="fail";save();renderFail();return false}
 return true;
}
function sceneBase(photo,badge){
 const wrap=document.createElement("div");wrap.className="scene";
 if(photo){const im=document.createElement("img");im.className="scene-photo";im.src=photo;im.alt="은평관 현장";wrap.appendChild(im)}
 const dim=document.createElement("div");dim.className="scene-dim";wrap.appendChild(dim);
 const b=document.createElement("div");b.className="badge";b.textContent=badge;wrap.appendChild(b);
 return wrap;
}
function dialog(wrap,name,text,actions){
 const box=document.createElement("section");box.className="dialog";
 const n=document.createElement("div");n.className="name";n.textContent=name;box.appendChild(n);
 const p=document.createElement("p");p.textContent=text;box.appendChild(p);
 const a=document.createElement("div");a.className="actions";
 actions.forEach(x=>{const b=document.createElement("button");b.type="button";b.textContent=x.text;if(x.primary)b.className="primary";b.onclick=x.fn;a.appendChild(b)});
 box.appendChild(a);wrap.appendChild(box);
}
function render(){
 hud();
 if(state.scene==="start")return renderStart();
 if(state.scene==="manager")return renderManager();
 if(state.scene==="evacuate")return renderEvacuate();
 if(state.scene==="equipment")return renderEquipment();
 if(state.scene==="location")return renderLocation();
 if(state.scene==="guide")return renderGuide();
 if(state.scene==="door")return renderDoor();
 if(state.scene==="down")return renderDown();
 if(state.scene==="remaining")return renderRemaining();
 if(state.scene==="mobility")return renderMobility();
 if(state.scene==="safe")return renderSafe();
 if(state.scene==="clear")return renderClear();
 if(state.scene==="fail")return renderFail();
}
function renderStart(){
 $("screen").innerHTML="";
 const s=sceneBase(IMG.fire,"하부층에서 연기 유입");
 const smoke=document.createElement("div");smoke.className="smoke";for(let i=0;i<4;i++)smoke.appendChild(document.createElement("b"));s.appendChild(smoke);
 dialog(s,"드리미","하부층에서 연기가 유입되고 있어요!\n지금 즉시 어떻게 행동할까요?",[
  {text:"사무실에 즉시 '하부층에서 빨간모자 발생' 무전",primary:true,fn:()=>{state.scene="manager";save();render()}},
  {text:"먼저 지정위치로 이동한다",fn:()=>wrongStart()},
  {text:"화재 주변 상황을 확인하러 혼자 내려간다",fn:()=>wrongStart()},
  {text:"고객에게 아무 안내 없이 기다린다",fn:()=>wrongStart()}
 ]);
 $("screen").appendChild(s);
}
function wrongStart(){if(spend())renderStart()}
function renderManager(){
 $("screen").innerHTML="";
 const s=sceneBase(IMG.fire,"관리자 지시");
 dialog(s,"관리자","지금 즉시 화재 주변 고객 대피 부탁드립니다.",[
  {text:"경광봉을 들고 화재 주변 고객을 대피시킨다",primary:true,fn:()=>{state.scene="evacuate";save();render()}},
  {text:"장비부터 챙기러 이동한다",fn:()=>{if(spend())renderManager()}}
 ]);

function renderEvacuate(){

  {text:"고객 대피 없이 지정위치로 이동한다",fn:()=>{if(spend())renderEvacuate()}}
 ]);

}
function renderEquipment(){

 const wrap=document.createElement("div");wrap.className="full";
 const ch=document.createElement("img");ch.className="character";ch.src=IMG.dreami;ch.alt="드리미";wrap.appendChild(ch);
 const panel=document.createElement("section");panel.className="panel";
 const p=document.createElement("p");p.textContent="현장 대응을 위해 필요한 장비를 2개 선택하세요.";panel.appendChild(p);
 const grid=document.createElement("div");grid.className="equipment-grid";
 const items=[["경광봉","baton"],["확성기","megaphone"],["랜턴","flashlight"],["안전조끼","vest"],["사고대응프로세스","process"]];
 state.equipment=[];
 items.forEach(([name,key])=>{
  const b=document.createElement("button");b.type="button";b.className="eq";
  const im=document.createElement("img");im.src=IMG[key];im.alt=name;b.appendChild(im);
  const sp=document.createElement("span");sp.textContent="["+name+"]";b.appendChild(sp);
  b.onclick=()=>{
   const idx=state.equipment.indexOf(key);
   if(idx>=0){state.equipment.splice(idx,1);b.classList.remove("selected");}
   else if(state.equipment.length<2){state.equipment.push(key);b.classList.add("selected");}
   else{return}
   count.textContent=state.equipment.length+" / 2 선택";
   if(state.equipment.length===2){
     setTimeout(()=>{
       const ok=state.equipment.includes("baton")&&state.equipment.includes("megaphone");
       if(ok){state.scene="location";state.equipment=[];save();render()}
       else{if(spend()){state.equipment=[];renderEquipment()}}
     },220);
   }
  };
  grid.appendChild(b);
 });
 panel.appendChild(grid);
 const count=document.createElement("div");count.className="count";count.textContent="0 / 2 선택";panel.appendChild(count);
 const note=document.createElement("div");note.className="note";note.textContent="※ 경광봉 + 확성기를 선택하면 다음 단계로 이동합니다.";panel.appendChild(note);
 wrap.appendChild(panel);$("screen").appendChild(wrap);
}
function renderLocation(){
 $("screen").innerHTML="";
 const wrap=document.createElement("div");wrap.className="full";
 const ch=document.createElement("img");ch.className="character";ch.src=IMG.dreami;ch.alt="드리미";wrap.appendChild(ch);
 const panel=document.createElement("section");panel.className="panel";
 const p=document.createElement("p");p.textContent="지정위치 어디로 이동할까요?";panel.appendChild(p);
 const grid=document.createElement("div");grid.className="location-grid";
 LOCS.forEach(([name,key])=>{
  const b=document.createElement("button");b.type="button";b.className="loc";
  b.innerHTML="<img src='"+IMG[key]+"' alt='"+name+" 실제 사진'><span>"+name+"</span>";
  b.onclick=()=>{
   if(name!==ASSIGNED){
    b.classList.add("wrong");
    if(spend())setTimeout(()=>{b.classList.remove("wrong");render()},180);
   }else{
    state.location={name,key};state.scene="guide";save();render();
   }
  };
  grid.appendChild(b);
 });
 panel.appendChild(grid);
 const note=document.createElement("div");note.className="note";note.textContent="※ 현재는 독립 테스트를 위해 지정위치 '홀'을 정답으로 설정했습니다.";panel.appendChild(note);
 wrap.appendChild(panel);$("screen").appendChild(wrap);
}
function photoForLoc(){return IMG[(state.location&&state.location.key)||"hall"]}
function renderGuide(){
 $("screen").innerHTML="";
 const s=sceneBase(photoForLoc(),"지정위치 · "+state.location.name);
 const ch=document.createElement("img");ch.className="character";ch.src=IMG.dreami;ch.alt="드리미";ch.style.cssText="position:absolute;z-index:6;left:9%;bottom:255px;height:145px;width:auto;";s.appendChild(ch);
 dialog(s,"드리미","고객님 이쪽으로 대피 부탁드립니다 ×2\n어린이와 노약자 우선 대피 부탁드립니다\n빨간 티셔츠 입은 고객님 거동이 불편한 고객님과 함께 대피 부탁드립니다.",[
  {text:"안내 후 비상구 문을 확인한다",primary:true,fn:()=>{state.scene="door";save();render()}}
 ]);
 $("screen").appendChild(s);
}
function renderDoor(){
 $("screen").innerHTML="";
 const s=sceneBase(photoForLoc(),"비상구 문 확인");
 dialog(s,"드리미","비상구 문 손잡이에 손등을 대어 온도를 확인합니다.\n문은 뜨겁지 않습니다. 다음 행동은?",[
  {text:"문을 열고 아래 상황을 확인한다",primary:true,fn:()=>{state.scene="down";save();render()}},
  {text:"바로 문을 열고 계단으로 내려간다",fn:()=>{if(spend())renderDoor()}}
 ]);
 $("screen").appendChild(s);
}
function renderDown(){
 $("screen").innerHTML="";
 const s=sceneBase(photoForLoc(),"아래 상황 확인");
 dialog(s,"드리미","문을 열어 아래쪽 상황을 확인했습니다.\n비상계단은 안전하게 이용할 수 있습니다.",[
  {text:"비상계단을 이용한다",primary:true,fn:()=>{state.scene="remaining";save();render()}},
  {text:"옥외 피난계단으로 이동한다",fn:()=>{if(spend())renderDown()}}
 ]);
 $("screen").appendChild(s);
}
function renderRemaining(){
 $("screen").innerHTML="";
 const wrap=document.createElement("div");wrap.className="full";
 const ch=document.createElement("img");ch.className="character";ch.src=IMG.dreami;ch.alt="드리미";wrap.appendChild(ch);
 const panel=document.createElement("section");panel.className="panel";
 const p=document.createElement("p");p.textContent="대피 완료했습니다. 잔여인원 확인 하러 이동하겠습니다.\n잔여인원이 있을 수 있는 장소 3곳을 선택하세요.";panel.appendChild(p);
 const grid=document.createElement("div");grid.className="actions";
 const opts=["상영관","홀","화장실","매점"], correct=new Set(["상영관","홀","화장실"]), picked=new Set();
 opts.forEach(x=>{
  const b=document.createElement("button");b.type="button";b.textContent=x;
  b.onclick=()=>{
   if(picked.has(x))return;
   if(!correct.has(x)){b.classList.add("wrong");if(spend())setTimeout(()=>renderRemaining(),180);return}
   picked.add(x);b.className="primary";b.textContent="✓ "+x;
   if(picked.size===3)setTimeout(()=>{state.scene="mobility";save();render()},200);
  };
  grid.appendChild(b);
 });
 panel.appendChild(grid);
 const note=document.createElement("div");note.className="note";note.textContent="※ 순서는 상관없습니다. 상영관 + 홀 + 화장실을 모두 선택해야 합니다.";panel.appendChild(note);
 wrap.appendChild(panel);$("screen").appendChild(wrap);
}
function renderMobility(){
 $("screen").innerHTML="";
 const s=sceneBase(IMG.hall,"잔여인원 확인");
 dialog(s,"드리미","홀에서 거동이 불편한 고객을 발견했습니다.\n어떻게 대응할까요?",[
  {text:"관리자에게 보고하고 안전한 장소로 이동시킨다",primary:true,fn:()=>{state.scene="safe";save();render()}},
  {text:"혼자 이동하도록 안내하고 다른 장소를 확인한다",fn:()=>{if(spend())renderMobility()}}
 ]);
 $("screen").appendChild(s);
}
function renderSafe(){
 $("screen").innerHTML="";
 const s=sceneBase(IMG.exit2,"안전한 장소");
 dialog(s,"드리미","00에서 거동이 불편한 고객 발견하여 안전한 장소로 이동하였습니다.\n안전한 장소는 어디인가요?",[
  {text:"옥외 피난계단 · 2관 퇴출로 왼쪽 계단",primary:true,fn:()=>{state.scene="clear";save();render()}},
  {text:"상영관 내부",fn:()=>{if(spend())renderSafe()}}
 ]);
 $("screen").appendChild(s);
}
function renderClear(){
 $("screen").innerHTML="";
 const wrap=document.createElement("div");wrap.className="full final";
 const ch=document.createElement("img");ch.className="character";ch.src=IMG.dreami;ch.alt="드리미";wrap.appendChild(ch);
 const panel=document.createElement("section");panel.className="panel";
 panel.innerHTML="<div class='name'>MISSION CLEAR</div><h2>대피 완료!</h2><p>모든 대응 절차를 완료했습니다.<br><b>최종 집결지 : 구파발역 3번 출구</b></p>";
 const b=document.createElement("button");b.className="restart";b.textContent="처음부터 다시 플레이";b.onclick=()=>{localStorage.removeItem(STORAGE_KEY);state={scene:"start",hearts:3,location:null,equipment:[]};render()};panel.appendChild(b);
 wrap.appendChild(panel);$("screen").appendChild(wrap);
}
function renderFail(){
 $("screen").innerHTML="";
 const wrap=document.createElement("div");wrap.className="full final";
 const panel=document.createElement("section");panel.className="panel";
 panel.innerHTML="<div class='name'>MISSION FAILED</div><h2>하트가 모두 소진되었습니다.</h2><p>FINAL MISSION을 다시 플레이해 주세요.</p>";
 const b=document.createElement("button");b.className="restart";b.textContent="처음부터 다시 플레이";b.onclick=()=>{localStorage.removeItem(STORAGE_KEY);state={scene:"start",hearts:3,location:null,equipment:[]};render()};panel.appendChild(b);
 wrap.appendChild(panel);$("screen").appendChild(wrap);
}
window.addEventListener("beforeunload",save);
if(!load()){save()}
render();
</script>
</body>
