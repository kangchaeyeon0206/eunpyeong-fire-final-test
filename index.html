const LOC={"홀":"HALL","2관 퇴출로":"EXIT2","사무실 비상계단 앞":"OFFICE","게임파크 앞":"GAME","8관 베이비시트 앞":"BABY"};
let step=0,hearts=3,assigned='홀',selectedLocation='홀',stairUsable=true,mobility=true,remaining=new Set();
const $=id=>document.getElementById(id);
function top(){ $('hearts').textContent='❤️'.repeat(Math.max(0,hearts))+'🖤'.repeat(Math.max(0,3-hearts)); $('bar').style.width=Math.min(100,Math.round(step/12*100))+'%'; }
function render(s){$('screen').innerHTML=s;document.querySelectorAll('[data-img]').forEach(img=>{const k=img.dataset.img;img.src=k==='LOCATION'?IMG[LOC[selectedLocation]]:IMG[k]||''});top();window.scrollTo(0,0)}
function fail(){hearts--;top();if(hearts<=0){render('<div class="center"><span class="badge">MISSION FAILED</span><h1>목숨을 모두 잃었습니다</h1><div class="big">0 POINT</div><p>오답 3회로 미션이 종료되었습니다.</p><button class="primary" onclick="location.reload()">다시 테스트</button></div>');return true}return false}
function question(title,text,opts,correct,next){render(`<span class="badge">STEP ${step}</span><h1>${title}</h1><div class="card"><div class="q">${text}</div><div class="opts">${opts.map((o,i)=>`<button data-answer="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="fb"></div></div>`);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const i=+b.dataset.answer;if(i===correct){b.style.borderColor='#43df88';b.style.background='#183a2a';setTimeout(()=>{step++;next()},180)}else{if(!fail())$('fb').innerHTML='<div class="feedback bad">오답입니다. ❤️ 1개가 차감되었습니다. 같은 단계에서 다시 선택하세요.</div>'}})}
function start(){render(`<span class="badge">STANDALONE TEST</span><h1>하부층 화재<br>FINAL MISSION</h1><p>기존 소방퀴즈와 연동하지 않은 독립 테스트입니다. 실제 대응 순서에 따라 마지막 미션을 수행해보세요.</p><div class="scene"><img class="bg" src="" data-img="SMOKE"><img class="dreami" src="" data-img="DREAMI"></div><div class="notice">테스트 기본값: 지정위치 <b>홀</b> · 비상계단 <b>사용 가능</b> · 거동 불편 고객 <b>발견</b></div><details class="testpanel"><summary>테스트 설정(선택)</summary><label>비상계단 상태 <select id="stairSel"><option value="1">사용 가능</option><option value="0">사용 불가</option></select></label><label>거동 불편 고객 <select id="mobSel"><option value="1">발견</option><option value="0">미발견</option></select></label></details><button class="primary" id="begin">미션 시작</button>`);$('begin').onclick=()=>{stairUsable=$('stairSel').value==='1';mobility=$('mobSel').value==='1';step=1;step1()}}
function step1(){question('STEP 1 · 최초 보고','하부층에서 연기 유입을 발견했다면 사무실에 어떻게 보고해야 할까요?',['하부층에서 연기 발생, 즉시 확인 부탁드립니다','하부층에서 빨간모자 발생, 빨간모자 발생, 빨간모자 발생','하부층 상황 확인 후 필요하면 다시 보고하겠습니다','화재 여부를 확인한 뒤 고객 대피부터 진행하겠습니다'],1,step2)}
function step2(){question('STEP 2 · 화재 주변 고객 대피','관리자가 “지금 즉시 화재 주변 고객 대피 부탁드립니다.”라고 지시했습니다. 가장 먼저 할 행동은?',['사무실로 돌아가 추가 지시를 기다린다','경광봉을 들고 “고객님 대피 부탁드립니다”라고 안내하며 화재 주변 고객을 대피시킨다','확성기를 먼저 챙긴 뒤 지정위치로 바로 이동한다','잔여인원 확인을 먼저 완료한 후 고객을 대피시킨다'],1,step3)}
function step3(){render(`<span class="badge">STEP 3</span><h1>지정위치로 이동</h1><p>현재 독립 테스트의 배정 위치는 <b>${assigned}</b>입니다.</p><div class="locgrid">${Object.keys(LOC).map(x=>`<button class="loc" data-loc="${x}">${x}</button>`).join('')}</div><div id="fb"></div>`);document.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{const x=b.dataset.loc;if(x===assigned){selectedLocation=x;step++;step4()}else if(!fail())$('fb').innerHTML='<div class="feedback bad">배정된 지정위치가 아닙니다. ❤️ 1개가 차감되었습니다.</div>'})}
function step4(){render(`<span class="badge">STEP 4</span><h1>비상계단 문 손잡이 확인</h1><p>지정위치에서 대피하기 전, 문 손잡이의 온도를 확인합니다.</p><div class="scene"><img class="bg" src="" data-img="LOCATION"><img class="dreami" src="" data-img="DREAMI"></div><div class="card"><div class="q">문 손잡이의 온도를 어떻게 확인할까요?</div><div class="opts">${['비상계단 난간을 손으로 확인한다','비상계단 문 손잡이를 손등으로 확인한다','문을 바로 열고 계단으로 내려간다','계단의 조명을 먼저 확인한다'].map((o,i)=>`<button data-door="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="fb"></div></div>`);document.querySelectorAll('[data-door]').forEach(b=>b.onclick=()=>{if(+b.dataset.door===1){step++;step5()}else if(!fail())$('fb').innerHTML='<div class="feedback bad">문 손잡이는 손등으로 확인해야 합니다.</div>'})}
function step5(){question('STEP 5 · 아래 상황 확인','문 손잡이가 뜨겁지 않았다면 다음 행동은 무엇일까요?',['문을 열고 아래쪽 계단의 상황을 확인한다','바로 옥외 피난계단으로 이동한다','문 손잡이를 다시 잡고 기다린다','잔여인원 확인부터 시작한다'],0,step6)}
function step6(){const a=stairUsable?'사용 가능':'사용 불가';question('STEP 6 · 대피경로 판단',`문을 열어 아래 상황을 확인했습니다. 현재 비상계단은 <b>${a}</b> 상태입니다. 어떤 경로로 대피할까요?`,stairUsable?['비상계단을 이용해 대피한다','문을 다시 닫고 홀에 대기한다','잔여인원 확인 후 계단 이용 여부를 결정한다','매점 방향으로 이동한다']:['옥외 피난계단을 이용해 대피한다','비상계단을 그대로 이용한다','문을 다시 열고 내려간다','홀에 남아 대기한다'],0,step7)}
function step7(){render(`<span class="badge">STEP 7 · 고객 대피 안내</span><h1>지정위치에서 대피 안내</h1><div class="scene"><img class="bg" src="" data-img="LOCATION"><img class="dreami" src="" data-img="DREAMI"></div><div class="card"><div class="q">경광봉을 머리 위로 들고 다음 순서대로 안내합니다.</div><div class="radio">“고객님 이쪽으로 대피 부탁드립니다” ×2<br>“어린이와 노약자 우선 대피 부탁드립니다”<br>“빨간 티셔츠 입은 고객님 거동이 불편한 고객님과 함께 대피 부탁드립니다”</div><button class="primary" id="next">안내 완료</button></div>`);$('next').onclick=()=>{step++;step8()}}
function step8(){render(`<span class="badge">STEP 8 · 0구역 보고</span><h1>대피 완료 후 보고</h1><p>지정위치에서 고객 대피를 완료했습니다.</p><div class="card"><div class="radio">“대피 완료했습니다. 잔여인원 확인 하러 이동하겠습니다”</div><button class="primary" id="next">보고 완료</button></div>`);$('next').onclick=()=>{step++;step9()}}
function step9(){remaining.clear();render(`<span class="badge">STEP 9 · 잔여인원 확인</span><h1>잔여인원을 확인하세요</h1><p>아래 장소 중 <b>상영관·홀·화장실</b> 3곳을 모두 선택하세요. 선택 순서는 자유이며 매점은 선택하지 않습니다.</p><div class="locgrid">${['상영관','홀','화장실','매점'].map((x,i)=>`<button class="loc" data-rem="${x}">${x}</button>`).join('')}</div><button class="primary" id="check">확인</button><div id="fb"></div>`);document.querySelectorAll('[data-rem]').forEach(b=>b.onclick=()=>{const x=b.dataset.rem;if(remaining.has(x)){remaining.delete(x);b.classList.remove('selected')}else{remaining.add(x);b.classList.add('selected')}});$('check').onclick=()=>{const ok=remaining.size===3&&['상영관','홀','화장실'].every(x=>remaining.has(x));if(ok){step++;step10()}else{remaining.clear();document.querySelectorAll('[data-rem]').forEach(b=>b.classList.remove('selected'));if(!fail())$('fb').innerHTML='<div class="feedback bad">상영관·홀·화장실 3곳을 정확히 선택해야 합니다. 매점은 선택하지 않습니다.</div>'}}}
function step10(){if(!mobility){finish();return}question('STEP 10 · 거동이 불편한 고객 발견','잔여인원을 확인하던 중 거동이 불편한 고객을 발견했습니다. 어떻게 조치할까요?',['고객을 그 자리에 두고 다른 장소의 확인을 먼저 완료한다','고객을 안전한 장소로 이동시키고 관리자에게 보고한다','고객에게 혼자 이동할 수 있는지 물어본 뒤 그대로 이동시킨다','상영관 안에서 대피방송이 끝날 때까지 대기하도록 안내한다'],1,step11)}
function step11(){question('STEP 11 · 안전한 장소 선택','거동이 불편한 고객을 이동시킬 안전한 장소는 어디일까요?',['홀 중앙','매점 앞','옥외 피난계단 (2관 퇴출로 왼쪽 계단)','상영관 내부'],2,finish)}
function finish(){step++;render(`<span class="badge">FINAL CLEAR</span><h1>MISSION CLEAR</h1><div class="scene"><img class="bg" src="" data-img="HALL"><img class="dreami" src="" data-img="DREAMI"></div><div class="card"><div class="radio">“00에서 거동이 불편한 고객 발견하여 안전한 장소로 이동하였습니다”</div></div><div class="card center"><p>모든 대응 절차를 완료했습니다.</p><div class="big">+1 POINT</div><p class="small">최종 집결지: <b>구파발역 3번 출구</b></p></div><button class="primary" onclick="location.reload()">테스트 다시하기</button>`)}
try{start()}catch(e){document.getElementById('screen').innerHTML='<div class="card"><h1>실행 오류</h1><p>페이지를 새로고침해 주세요.</p><pre style="white-space:pre-wrap;color:#ffb6b6">'+String(e)+'</pre></div>';console.error(e)}
</script></body></html>
